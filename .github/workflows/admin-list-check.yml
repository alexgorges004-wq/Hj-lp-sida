name: admin list validation
on:
  push:
    branches: [fix/admin-list-loading]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check netlify/functions/admin-users.mjs
      - run: npm install --ignore-scripts
      - run: npm run build
