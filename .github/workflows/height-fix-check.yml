name: text block height validation
on:
  push:
    branches: [fix/textblock-auto-height-2]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check v2-height-fix.js && node --check v2.js && node --check build.js
      - run: npm install --ignore-scripts
      - run: npm run build
