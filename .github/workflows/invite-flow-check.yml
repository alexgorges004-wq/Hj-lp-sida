name: admin invite flow validation
on:
  push:
    branches: [feature/admin-invite-password]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check v2-invite.js && node --check v2.js && node --check build.js && node --check netlify/functions/admin-users.mjs
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: test -f dist/v2-invite.js
